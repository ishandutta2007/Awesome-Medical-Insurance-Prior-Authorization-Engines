<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="line-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blur-med" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-16px) scale(1.05); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px) scale(1.03); }
        50% { transform: translateY(14px) scale(0.98); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { opacity: 0.85; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes orbPulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes pingDot {
        0% { r: 3px; opacity: 0.9; }
        50% { r: 7px; opacity: 0.3; }
        100% { r: 3px; opacity: 0.9; }
      }
      .ambient-1 { animation: floatSlow 10s ease-in-out infinite; transform-origin: center; }
      .ambient-2 { animation: floatRev 12s ease-in-out infinite; transform-origin: center; }
      .data-stream {
        stroke-dasharray: 120 180;
        animation: pulseBeam 5s linear infinite;
      }
      .data-stream-rev {
        stroke-dasharray: 90 200;
        animation: pulseBeam 6s linear infinite reverse;
      }
      .glowing-circle { animation: orbPulse 6s ease-in-out infinite; }
      .pinging-node { animation: pingDot 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bg-grad)"/>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.7">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M120 0 V380 M240 0 V380 M360 0 V380 M480 0 V380 M600 0 V380 M720 0 V380 M840 0 V380 M960 0 V380 M1080 0 V380" />
  </g>

  <!-- Ambient Animated Glowing Orbs (Strictly in Background) -->
  <g opacity="0.5">
    <circle class="ambient-1" cx="220" cy="110" r="140" fill="url(#glow-teal)" filter="url(#blur-large)"/>
    <circle class="ambient-2" cx="980" cy="270" r="160" fill="url(#glow-purple)" filter="url(#blur-large)"/>
    <circle class="glowing-circle" cx="600" cy="190" r="110" fill="#2563eb" opacity="0.25" filter="url(#blur-med)"/>
  </g>

  <!-- Dynamic FHIR / Prior-Auth Network Streams (Flow Behind Content) -->
  <g opacity="0.45" fill="none" stroke-width="2">
    <!-- Payer-to-Provider Flow 1 -->
    <path class="data-stream" d="M -50 80 Q 300 20, 600 120 T 1250 80" stroke="url(#line-flow)" />
    <!-- Clinical Decision Tree Flow 2 -->
    <path class="data-stream-rev" d="M -50 300 Q 350 360, 650 250 T 1250 310" stroke="url(#line-flow)" stroke-width="1.8"/>
  </g>

  <!-- Decorative Circuit Nodes -->
  <g opacity="0.6">
    <circle cx="160" cy="80" r="3" fill="#38bdf8" class="pinging-node" />
    <circle cx="1040" cy="300" r="3" fill="#c084fc" class="pinging-node" />
    <circle cx="920" cy="90" r="4" fill="#34d399" />
    <circle cx="280" cy="290" r="4" fill="#38bdf8" />
  </g>

  <!-- Main Card Container with Glassmorphism Border -->
  <rect x="50" y="35" width="1100" height="310" rx="16" fill="#0b1329" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- ================= FOREGROUND CONTENT (ALWAYS CRISP & VISIBLE) ================= -->

  <!-- Top Category Tag & Ecosystem Pills -->
  <g transform="translate(85, 75)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="15" cy="15" r="5" fill="#34d399"/>
    <text x="30" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">HEALTHCARE AI &amp; FINTECH</text>

    <!-- Interoperability Standard Pill -->
    <rect x="232" y="0" width="195" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="247" y="19" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ CMS-0057-F &amp; Da Vinci PAS</text>

    <!-- Open Source Pill -->
    <rect x="439" y="0" width="180" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <text x="454" y="19" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🛡️ HIPAA &amp; FHIR R4 Ready</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(85, 160)">
    <text x="0" y="0" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" filter="url(#neon-glow)">
      Awesome Medical Insurance Prior-Authorization Engines
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(85, 198)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated directory of enterprise SaaS solutions, clinical LLM multi-agents, and open-source Da Vinci PAS engines
    </text>
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Automating clinical criteria matching, payer-provider exchange, EHR integration, and touchless appeals
    </text>
  </g>

  <!-- Feature Highlights / Tag Grid (Bottom Row) -->
  <g transform="translate(85, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="18" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🤖 Clinical LLM Copilots</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="235" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="18" y="26" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔄 CDS Hooks &amp; DTR / CRD</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="230" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="18" y="26" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📋 Automated Denial Appeals</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(735, 0)">
      <rect x="0" y="0" width="275" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="18" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚖️ Evidence-Based Policy RAG</text>
    </g>
  </g>
</svg>
